<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Belépés · Iroda</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/style.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width: 380px; margin-top: 12vh;">
  <div class="card shadow-sm p-4">
    <h4 class="mb-3">🏢 Iroda – belépés</h4>
    {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
    {% if not configured %}
      <div class="alert alert-warning py-2 small">
        Az <code>ADMIN_PASSWORD_HASH</code> nincs beállítva, ezért a belépés nem működik.
        Hash generálása: <code>python scripts/hash_password.py</code>, majd állítsd be
        környezeti változóként.
      </div>
    {% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next_url }}">
      <div class="mb-3">
        <label class="form-label" for="password">Jelszó</label>
        <input class="form-control" type="password" id="password" name="password" autofocus required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Belépés</button>
    </form>
  </div>
</div>
</body>
</html>
